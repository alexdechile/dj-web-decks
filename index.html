<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Web Decks</title>

  <!-- SEO -->
  <meta name="description"
    content="DJ Web Decks - Mezcla música desde YouTube con dos decks virtuales, crossfader y automix.">
  <meta name="theme-color" content="#0a0a0f">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="screen.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Wake Lock Indicator -->
  <div id="wakeLockIndicator" class="wake-lock-indicator inactive">
    <span class="dot"></span>
    <span>Pantalla activa</span>
  </div>

  <div class="container">
    <!-- Deck A -->
    <div class="deck deck-a glass-card">
      <h2>Deck A</h2>

      <div class="track-info">
        <p class="track-title-display" id="titleA">Sin pista cargada</p>
        <p class="track-subtitle" id="subtitleA"></p>
      </div>

      <div class="jogwheel" id="jogwheelA"></div>

      <p class="bpm" id="bpmA">-- BPM</p>

      <div class="controls">
        <button id="playA">▶ Play</button>
        <button id="pauseA">⏸ Pause</button>
        <button id="stopA">⏹ Stop</button>
        <button id="cueA" class="cue-button">CUE</button>
      </div>

      <div class="url-input-group">
        <input type="text" id="ytUrlA" placeholder="Link de YouTube...">
        <button id="loadA">Cargar</button>
      </div>
      <p class="disclaimer">Para uso personal</p>

      <audio id="deckA" crossorigin="anonymous"></audio>
    </div>

    <!-- Mixer -->
    <div class="mixer glass-card">
      <h2>Mixer</h2>

      <div class="vu-meter-container">
        <div class="vu-meter-wrapper">
          <label>A</label>
          <div class="vu-meter">
            <div class="vu-bar" id="vuBarA"></div>
          </div>
        </div>
        <div class="vu-meter-wrapper">
          <label>B</label>
          <div class="vu-meter">
            <div class="vu-bar" id="vuBarB"></div>
          </div>
        </div>
      </div>

      <div class="crossfader-container">
        <label>Crossfader</label>
        <input type="range" id="crossfader" class="crossfader" min="0" max="100" value="50">
      </div>

      <div class="mixer-options">
        <label>
          <input type="checkbox" id="compressorToggle" checked>
          Normalizar Volumen
        </label>
        <button id="bluetoothBtn" class="btn-cast" title="Conectar a dispositivo Bluetooth">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M14.88,13.34L12,10.47V14.53L14.88,11.66M12,2.47L17.53,8L12,13.53V9.47L9.12,12.34L7,10.22M19.07,6.5L12,0L4.93,6.5L12,13.07M4.93,17.5L12,24L19.07,17.5L12,11.47L4.93,17.5Z"></path></svg>
        </button>
        <button id="castBtn" class="btn-cast" title="Enviar a dispositivo">
          <svg viewBox="0 0 24 24"><path d="M1,18 L1,21 L4,21 C4,19.34 2.66,18 1,18 Z M1,14 L1,16 C3.76,16 6,18.24 6,21 L8,21 C8,17.13 4.87,14 1,14 Z M1,10 L1,12 C5.97,12 10,16.03 10,21 L12,21 C12,14.92 7.07,10 1,10 Z M21,3 L3,3 C1.9,3 1,3.9 1,5 L1,8 L3,8 L3,5 L21,5 L21,19 L14,19 L14,21 L21,21 C22.1,21 23,20.1 23,19 L23,5 C23,3.9 22.1,3 21,3 Z"></path></svg>
        </button>
      </div>

      <button id="transitionBtn" class="btn-mix">🔄 Transición</button>
      <button id="autoMixBtn" class="btn-mix">⚡ Auto Mix</button>

      <!-- Recording Controls -->
      <div class="recording-section">
        <div class="recording-header">
          <span class="rec-indicator" id="recIndicator"></span>
          <span class="rec-time" id="recTime">00:00</span>
        </div>
        <div class="recording-controls">
          <button id="recBtn" class="btn-rec">⏺ REC</button>
          <button id="downloadBtn" class="btn-download" disabled>💾 Descargar MP3</button>
        </div>
      </div>
    </div>

    <!-- Deck B -->
    <div class="deck deck-b glass-card">
      <h2>Deck B</h2>

      <div class="track-info">
        <p class="track-title-display" id="titleB">Sin pista cargada</p>
        <p class="track-subtitle" id="subtitleB"></p>
      </div>

      <div class="jogwheel" id="jogwheelB"></div>

      <p class="bpm" id="bpmB">-- BPM</p>

      <div class="controls">
        <button id="playB">▶ Play</button>
        <button id="pauseB">⏸ Pause</button>
        <button id="stopB">⏹ Stop</button>
        <button id="cueB" class="cue-button">CUE</button>
      </div>

      <div class="url-input-group">
        <input type="text" id="ytUrlB" placeholder="Link de YouTube...">
        <button id="loadB">Cargar</button>
      </div>
      <p class="disclaimer">Para uso personal</p>

      <audio id="deckB" crossorigin="anonymous"></audio>
    </div>
  </div>

  <!-- Playlist Module -->
  <div class="playlist-module glass-card">
    <h2>📋 Playlist</h2>

    <div class="playlist-controls">
      <input type="text" id="playlistUrlInput" placeholder="URL de playlist de YouTube..." list="playlist-history">
      <datalist id="playlist-history"></datalist>
      <button id="loadPlaylistBtn">Cargar</button>
      <button id="favPlaylistBtn" title="Mis Listas Favoritas">⭐</button>
      <button id="playlistAutoMixBtn">▶ Automix</button>
    </div>

    <p id="automixStatus" class="status-message"></p>

    <div id="playlistContainer" class="track-list">
      <!-- Track items will be inserted here -->
    </div>
  </div>

  <!-- Favorites Modal -->
  <div id="favModal" class="modal-overlay hidden">
    <div class="modal-content glass-card">
      <h3>Mis Playlists</h3>
      
      <div class="add-fav-group">
        <input type="text" id="favNameInput" placeholder="Nombre para esta lista...">
        <button id="saveFavBtn" class="btn-mix">Guardar Actual</button>
      </div>

      <div id="favList" class="device-list">
        <!-- Favorites will be here -->
      </div>

      <button id="closeFavModal" class="btn-mix" style="margin-top: 1rem;">Cerrar</button>
    </div>
  </div>

  <!-- Chromecast Modal -->
  <div id="castModal" class="modal-overlay hidden">
    <div class="modal-content glass-card">
      <h3>Enviar a Dispositivo</h3>
      <div id="castDeviceList" class="device-list">
        <p>Buscando...</p>
      </div>
      
      <!-- Entrada manual de IP -->
      <div class="manual-ip-section" style="margin-top: 1rem; border-top: 1px solid #444; padding-top: 1rem;">
        <p style="font-size: 0.9rem; margin-bottom: 0.5rem; color: #aaa;">¿No aparece? Ingresa la IP manualmente:</p>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="manualIpInput" placeholder="Ej: 192.168.1.50" style="flex:1; padding: 0.5rem; background: #222; border: 1px solid #444; color: white; border-radius: 4px;">
          <button id="manualCastBtn" class="btn-mix" style="margin:0; font-size: 0.9rem;">Conectar</button>
        </div>
      </div>

      <button id="closeCastModal" class="btn-mix" style="margin-top: 1rem;">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
